// App 模块：空壳 App 跑通 GeckoView 内核（issue #3）
// 版本钉见 docs/build-recipe.md；依赖仅 GeckoView 一项，不引 appcompat / material 等任何其他库（ADR 0003）。
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aifenshen.browser'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.aifenshen.browser'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // JDK 17（Temurin）为本机已验证环境（docs/build-recipe.md），Java 与 Kotlin 字节码目标保持一致
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Kotlin 2.2.0 的 compilerOptions 写法（与上面 compileOptions 成对出现，避免 JVM target 不一致报错）
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // 唯一允许的内核依赖（只在 https://maven.mozilla.org/maven2/ 发布，settings.gradle 已声明该源）
    implementation 'org.mozilla.geckoview:geckoview:155.0.20260903215306'
}
