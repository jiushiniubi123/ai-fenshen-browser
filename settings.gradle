// 插件与依赖的解析仓库（版本钉见 docs/build-recipe.md，一个字符不许改）
pluginManagement {
    repositories {
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        // GeckoView 只在此源发布（docs/build-recipe.md）
        maven {
            url 'https://maven.mozilla.org/maven2/'
        }
    }
}

rootProject.name = 'ai-fenshen-browser'
include ':app'
